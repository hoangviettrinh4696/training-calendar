<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý lịch đào tạo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f5f6f8;
    }

    h1 {
      color: #1f3c5c;
    }

    h2 {
      margin-top: 30px;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
    }

    button {
      padding: 10px 18px;
      background-color: #1f3c5c;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }

    th {
      background-color: #1f3c5c;
      color: white;
    }

    .note {
      margin-top: 15px;
      padding: 12px;
      background-color: #eef3f8;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Quản lý lịch đào tạo</h1>

    <p>
      Theo dõi thời gian tổ chức các khóa học và kiểm tra trùng lịch.
    </p>

    <h2>Thêm khóa học</h2>

    <div class="form-group">
      <label for="courseName">Tên khóa học</label>
      <input type="text" id="courseName">
    </div>

    <div class="form-group">
      <label for="startDate">Ngày bắt đầu</label>
      <input type="date" id="startDate">
    </div>

    <div class="form-group">
      <label for="endDate">Ngày kết thúc</label>
      <input type="date" id="endDate">
    </div>

    <div class="form-group">
      <label for="startTime">Giờ bắt đầu</label>
      <input type="time" id="startTime">
    </div>

    <div class="form-group">
      <label for="endTime">Giờ kết thúc</label>
      <input type="time" id="endTime">
    </div>

    <div class="form-group">
      <label for="studentCount">Số học viên</label>
      <input type="number" id="studentCount">
    </div>

    <button onclick="addCourse()">Thêm khóa học</button>

    <div class="note">
      Dữ liệu bạn nhập sẽ được lưu trên trình duyệt của máy đang sử dụng.
    </div>

    <h2>Danh sách khóa học</h2>

    <table>
      <thead>
        <tr>
          <th>Tên khóa học</th>
          <th>Ngày bắt đầu</th>
          <th>Ngày kết thúc</th>
          <th>Thời gian</th>
          <th>Số học viên</th>
        </tr>
      </thead>

      <tbody id="courseTable">
      </tbody>
    </table>

  </div>

  <script>
    let courses = JSON.parse(localStorage.getItem("courses")) || [];

    function formatDate(date) {
      const parts = date.split("-");
      return parts[2] + "/" + parts[1] + "/" + parts[0];
    }

    function saveCourses() {
      localStorage.setItem("courses", JSON.stringify(courses));
    }

    function renderCourses() {
      const table = document.getElementById("courseTable");

      table.innerHTML = "";

      courses.forEach(function(course) {
        const newRow = table.insertRow();

        newRow.innerHTML = `
          <td>${course.courseName}</td>
          <td>${formatDate(course.startDate)}</td>
          <td>${formatDate(course.endDate)}</td>
          <td>${course.startTime} - ${course.endTime}</td>
          <td>${course.studentCount}</td>
        `;
      });
    }

    function addCourse() {
      const courseName = document.getElementById("courseName").value;
      const startDate = document.getElementById("startDate").value;
      const endDate = document.getElementById("endDate").value;
      const startTime = document.getElementById("startTime").value;
      const endTime = document.getElementById("endTime").value;
      const studentCount = document.getElementById("studentCount").value;

      if (
        courseName === "" ||
        startDate === "" ||
        endDate === "" ||
        startTime === "" ||
        endTime === ""
      ) {
        alert("Vui lòng nhập đầy đủ thông tin khóa học.");
        return;
      }

      const newCourse = {
        courseName: courseName,
        startDate: startDate,
        endDate: endDate,
        startTime: startTime,
        endTime: endTime,
        studentCount: studentCount
      };

      courses.push(newCourse);

      saveCourses();

      renderCourses();

      document.getElementById("courseName").value = "";
      document.getElementById("startDate").value = "";
      document.getElementById("endDate").value = "";
      document.getElementById("startTime").value = "";
      document.getElementById("endTime").value = "";
      document.getElementById("studentCount").value = "";
    }

    renderCourses();
  </script>

</body>
</html>
